name: Keep Supabase Alive

on:
  schedule:
    # Runs automatically every day at midnight (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI for testing

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send API Request to Supabase
        run: |
          curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/rooms?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"